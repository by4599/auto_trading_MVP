      - "112040"  # 위메이드
    robot:
      - "277810"  # 레인보우로보틱스
    # ── 대형주 비교군 (이벤트 둔감 대조·벤치마크 역할) ──
    large-benchmark:
      - "402340"  # SK스퀘어
      - "105560"  # KB금융
      - "032830"  # 삼성생명
      - "028260"  # 삼성물산
      - "000270"  # 기아
      - "055550"  # 신한지주
      - "329180"  # HD현대중공업
      - "012450"  # 한화에어로스페이스
      - "034020"  # 두산에너빌리티
