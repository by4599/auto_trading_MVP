spring:
  application:
    name: auto-trading-mvp

# ─── 데이터 수집·통계 표본 (매매 대상 아님 — 유니버스는 별도, 게이트 G1) ────────
# event-themes: 분봉 전방 축적(MinuteCandleCollector) + 이벤트 통계(B-4) 표본을
# 테마(밸류체인) → 종목 맵으로 관리한다. 평면 목록 소비처는 getEventSymbols() 평면화 사용.
# 1차 선정(2026-07-13): 시가총액 상위 (우선주·스팩·리츠·ETF 제외) — 당일 거래대금
# 순위는 단기 테마주 스냅샷이라 편향이 커서 "상시 유동성"의 안정 프록시로 시총 채택.
# 2차 보강(2026-07-14): 반도체 밸류체인 유동성 상위 10종목 — "앵커 대형주 호재 →
# 동일 테마 관련주 파급(spillover)" 가설의 파일럿. 테마 키는 B-4 파급 통계의 그룹 축.
# paper·backtest 두 프로필이 공유한다.
backtest:
  event-themes:
    # ── 반도체 밸류체인 (파일럿 테마) ──
    semi-anchor:        # 체인 앵커 — backtest.symbols(B-3)와 중복이나 소비처가 중복 제거함
      - "005930"  # 삼성전자
      - "000660"  # SK하이닉스
    semi-chain:         # 장비·소재·부품·후공정
      - "036930"  # 주성엔지니어링 (증착 장비)
      - "240810"  # 원익IPS (증착 장비)
      - "058470"  # 리노공업 (테스트 소켓)
      - "319660"  # 피에스케이 (전공정 장비)
      - "039030"  # 이오테크닉스 (레이저 장비)
      - "222800"  # 심텍 (패키지 기판)
      - "095610"  # 테스 (전공정 장비)
      - "440110"  # 파두 (SSD 컨트롤러 팹리스)
      - "009150"  # 삼성전기 (기판·MLCC, KOSPI)
      # 2026-07-14 밸류체인 보강 10 (유동성 상위)
      - "042700"  # 한미반도체 (HBM TC본더, KOSPI)
      - "403870"  # HPSP (고압 수소 어닐링 장비)
      - "084370"  # 유진테크 (전공정 장비)
      - "005290"  # 동진쎄미켐 (포토레지스트 소재)
      - "357780"  # 솔브레인 (식각·세정 소재)
      - "089030"  # 테크윙 (테스트 핸들러)
      - "074600"  # 원익QnC (쿼츠웨어)
      - "067310"  # 하나마이크론 (패키징 OSAT)
      - "348210"  # 넥스틴 (웨이퍼 패턴 검사)
      - "281820"  # 케이씨텍 (CMP 장비·슬러리, KOSPI)
    # ── 기타 테마 태그 (기존 표본 분류 — 파급 검증은 반도체 파일럿 결과 후 확장) ──
    battery:
      - "247540"  # 에코프로비엠
      - "086520"  # 에코프로
      - "006400"  # 삼성SDI
    bio:
      - "196170"  # 알테오젠
      - "028300"  # HLB
      - "207940"  # 삼성바이오로직스
      - "950160"  # 코오롱티슈진
      - "298380"  # 에이비엘바이오
      - "000250"  # 삼천당제약
      - "141080"  # 리가켐바이오
    game:
