# 백테스트 프로파일 (B-2) — 실행: --spring.profiles.active=backtest
#
# 라이브 trading-db와 완전히 분리된 backtest-db를 쓴다.
# PendingOrderRule 등 리스크 룰이 JPA를 직접 읽으므로, 시뮬 주문이
# 라이브 DB에 섞이면 실계좌 판단이 오염된다. backtest-db.mv.db는 .gitignore 대상.
server:
  address: 127.0.0.1

spring:
  main:
    web-application-type: none   # 대시보드 불필요 — 배치처럼 실행 후 종료

  datasource:
    url: jdbc:h2:file:./backtest-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# candle_history 백필에 KIS 시세 API가 필요하다 (모의투자 URL — paper와 동일)
kis:
  base-url: https://openapivts.koreainvestment.com:29443
  appkey: ${KIS_APPKEY}
  secretkey: ${KIS_SECRETKEY}
  account-no: ${KIS_ACCOUNT_NO}

# 백테스트 중 알림은 차단. DART 키는 B-4 공시 소급 백필에 필요
# (스케줄러 자체가 backtest 프로필에서 꺼져 있어 30분 수집은 돌지 않는다)
telegram:
  bot-token: ""
  chat-id: ""
dart:
  api-key: ${DART_API_KEY:}

backtest:
  years: 3
  include-kospi: true
  initial-cash: 10000000
  # backfill-from: 2020-01 크래시 구간을 워밍업(260일) 포함해 판정할 수 있도록 소급 저장 하한.
  #   판정 창과 무관 — 저장 범위만 정한다. years/전역 from·to는 그대로라 기존 모드
  #   (full/smoke/ma-breakout/scalping/events/exit-lab)의 재생 구간과 결과는 변하지 않는다.
  #   (KIS 일봉은 2000년대까지 조회되는 것을 실측 확인 — 2019-04부터면 2020-01 판정에 충분)
  backfill-from: "2019-04-01"
  # B-3 유니버스 확장 재검증 (2026-07-20) — 대형주 6종목 + 중소형 33종목(39종목)으로
  # 재검증했으나 기각됨(PF 0.60·MDD 61.4%, 6종목 기준선보다 악화 — BACKTEST-DESIGN §12).
  # 원본 6종목 기본값(BacktestDataProperties)으로 원복 — 실험 재현이 필요하면
  # git 이력에서 이 커밋 직전 버전의 symbols 목록을 복원할 것.

  # ── §14.1 후보 검증(cost-lab·risk-lab) 전용 고정 설정 (2026-07-23 재현성 결함 해소) ──
  # 아래 4개는 BacktestDataProperties 기본값과 동일 — 저장소만 보고도 후보 표본·기간을
  # 알 수 있도록 명시한다. cost-lab·risk-lab 두 모드만 읽으며, 전역 symbols/from/to와 무관해
  # 다른 모드(full/smoke/ma-breakout/scalping/events/exit-lab)에는 영향이 없다.
  #
  # candidate-symbols: §14.1 기준선 표본 54종목 (재현성을 위해 순서 그대로 고정)
  candidate-symbols:
    - "005930"  # 삼성전자
    - "000660"  # SK하이닉스
    - "373220"  # LG에너지솔루션
    - "005380"  # 현대차
    - "035420"  # NAVER
    - "068270"  # 셀트리온
