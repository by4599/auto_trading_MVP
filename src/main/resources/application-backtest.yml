  # candidate-from/to: §14.1 기준선을 재현하는 고정 판정 창 (부동 날짜 제거 — defect #1).
  #   새 데이터로 재검증하려면 이 값을 의도적으로 바꾸는 게 '기준선을 새로 찍겠다'는 명시 행위다.
  candidate-from: "2023-07-22"
  candidate-to: "2026-07-21"
  # crash-vol-from/to: crash-vol 모드 전용 측정 창 (candidate-from/to와 독립 — 재현성 위해 고정).
  #   §14.1 판정 창(2023-07~)에는 진짜 하락장이 없어(급락 5건 전부 V자 반등) 약세장 방어를
  #   검증할 수 없다. 2020-01(코로나 폭락)·2022(금리 쇼크)를 포함하는 별도 창을 못 박는다.
  #   cost-lab·risk-lab은 candidate-from/to를 그대로 쓰므로 §14.1 재현 기준선은 불변.
  crash-vol-from: "2020-01-01"
  crash-vol-to: "2026-07-21"
  # stress-from/to: regime-lab 모드 전용 판정 창 (candidate-from/to와 독립 — 재현성 위해 고정).
  #   §14.3 약세장 스트레스와 같은 6.5년 창(2020 코로나·2022 금리 쇼크 포함, 검증 24창)이라
  #   G0(필터 OFF) 결과를 §14.3 RR1(트레이드 1591·PF 1.26·MDD 33.5%)과 직접 대조할 수 있다.
  #   cost-lab·risk-lab은 candidate-from/to를 그대로 쓰므로 §14.1 재현 기준선은 불변.
  stress-from: "2020-01-01"
  stress-to: "2026-07-21"
  # write-baseline: 거버넌스 기준선 yml 기록 여부. 기본 false — 대조·점검 실행이 기준선을
  #   조용히 덮어쓰던 사고(defect #3) 차단. 기준선을 새로 찍을 때만 --backtest.write-baseline=true.
  write-baseline: false
