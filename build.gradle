plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group   = 'com.trading'
version = '0.0.1-SNAPSHOT'

// 프로젝트 경로에 한글('개발')이 포함되어 Gradle test worker의 URL ClassLoader가
// Korean 문자를 percent-encode하지 못해 ClassNotFoundException이 발생한다.
// build 출력 디렉터리를 ASCII 경로로 우회한다.
// 다른 머신에서는 -PbuildDir=/path/to/build 또는 TRADING_BUILD_DIR 환경변수로 오버라이드한다.
def buildBase = System.getenv('TRADING_BUILD_DIR') ?: project.findProperty('buildDir') ?: 'C:/Users/SAMSUNG/auto_trading-build'
layout.buildDirectory.set(file(buildBase))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Spring Boot 3.3.5의 ASM은 Java 25 클래스 파일(버전 69)을 미지원.
// Java 25 JDK로 컴파일하되 Java 21 호환 클래스 파일을 생성한다.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 낙관적 락 재시도 — 두 의존성 모두 필수
    // spring-retry  : @Retryable, @EnableRetry 어노테이션 제공
    // spring-aspects: AspectJ 위빙 없이 @Retryable 어노테이션이 동작하지 않음
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // 텔레그램 알림 (HTTP 클라이언트)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // H2 — 모의투자 로컬 실행 및 테스트용
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Gradle 9.x + JUnit 5: launcher를 명시적으로 선언해야 테스트 실행 가능
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    forkEvery = 0
    maxHeapSize = '512m'
    jvmArgs(
        '-Dfile.encoding=UTF-8',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util.concurrent.atomic=ALL-UNNAMED'
    )
}
